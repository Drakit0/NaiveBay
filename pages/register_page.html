<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <title>Login Page</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    </head>
    <body>
        <main class="register-container">
            <!-- Video section -->

            <div class="info-container">
                <header class="logo-container">
                    <!-- Put the logo of the page -->
                </header>

                <section class="info-user-container">
                    <form class="login-form">
                        
                        <input class="text-input" type="text" id="Name" name="Name" required placeholder="Name*">
                        <input class="text-input" type="text" id="Surname 1" name="Surname1" required placeholder="Surname1*">
                        <input class="text-input" type="text" id="Surname 2" name="Surname2" placeholder="Surname2">
                        <input class="text-input" type="text" id="Username" name="username" required placeholder="Username*">
                        <input class="text-input" type="text" id="Password" name="Password" required placeholder="Password*">
                        <input class="text-input" type="text" id="Confirm password" name="Confirm password" required placeholder="Confirm password*">
                        <input class="text-input" type="text" id="Mail" name="Mail" required placeholder="Mail*">
                        <input class="text-input" type="text" id="Adress" name="Adress" required placeholder="Adress*">
                        <input class="text-input" type="text" id="Hall" name="Hall" required placeholder="Hall*">
                        <input class="text-input" type="text" id="ID" name="ID" required placeholder="ID*">

                        <select id="Autonomous community" name="Autonomous community" required placeholder="Autonomous community*">
                            <option value="">Select</option>
                        </select>   
                        <select id="City" name="City" required placeholder = "City*">
                            <option value="">Select</option>
                        </select> 
                        
                        <input type="date" id="birthdate" name="birthdate" required placeholder="Year/Month/Day*">
    
                        <button type="Log In">Log In</button>
                        <button type="Google Log In">Google Log In</button>
                        <button type="Back">Back</button>
                        <button type="submit">Register</button>

                    </form>

                    <!-- Button links -->

                </section>

                <footer>
                    <p class="text">NaiveBay 2025 © </p>
                </footer>

            </div>
        </main>
    </body>
</html>
