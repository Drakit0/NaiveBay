<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <title>Register Page</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Pablo Tuñón Laguna">

        <link rel="stylesheet" href="../css/register_components.css"> 
        <link rel="stylesheet" href="../css/login_components.css"> 
        <link rel="stylesheet" href="../css/components.css"> 
        <link rel="stylesheet" href="../css/normalize.css"> 

        <link rel="icon" href="../assets/images/logo_transparente.png" type="image/png">
    </head>
    <body>
        <main class="register-page-container">
            <video class="register-video" autoplay muted loop playsinline>
                <source src="../assets/videos/beach_login.mp4">
            </video>

            <div class="register-container">
                <header class="login-header">
                    <img class="register-logo" src="../assets/images/logo_transparente.png">
                    <h4 class="text">Register a new account</h4>
                </header>

                <section class="info-user-container">
                    <form class="register-form">
                        
                        <div class="name-container">
                            <input class="text-input" type="text" id="Name" name="Name" required placeholder="Name*">
                            <input class="text-input" type="text" id="Surname 1" name="Surname1" required placeholder="Surname 1*">
                            <input class="text-input" type="text" id="Surname 2" name="Surname2" placeholder="Surname 2">
                        </div>

                        <input class="text-input" type="text" id="Username" name="username" required placeholder="Username*">
                        <input class="text-input" type="text" id="Password" name="Password" required placeholder="Password*">
                        <input class="text-input" type="text" id="Confirm password" name="Confirm password" required placeholder="Confirm password*">
                        <input class="text-input" type="text" id="Mail" name="Mail" required placeholder="Mail*">

                        <div class="address-container">
                            <input class="text-input" type="text" id="Adress" name="Adress" required placeholder="Adress*">
                            <input class="text-input" type="text" id="Hall" name="Hall" required placeholder="Hall*">
                            <input class="text-input" type="text" id="Door" name="Door" required placeholder="Door">
                        </div>

                        <input class="text-input" type="text" id="ID" name="ID" required placeholder="ID*">

                        <div class="postal-code-container">
                            <select id="Autonomous community" name="Autonomous community" required>
                                <option value="">Autonomous community*</option>
                                <option value="Madrid">Madrid</option>
                                <option value="Valencian Community">Valencian Community</option>
                            </select>   
                            
                            <select id="City" name="City" required>
                                <option value="">City*</option>
                            </select> 
                        </div>
                        
                        <input class="date-selector" type="date" id="birthdate" name="birthdate" required>
                        
                        <input class="button login-button button__blue" type="submit" value="Register">

                    </form>

                    <a href="../index.html" class="nav-button-container button-text">
                        <button class="button login-button ">Back</button>
                    </a>
                    <nav class="login-links-container">
                        <a class="login-link text" href="#">Log In</a>
                    </nav> 

                </section>

                <footer>
                    <p class="text">NaiveBay 2025 © </p>
                </footer>

            </div>
        </main>
    </body>
</html>
