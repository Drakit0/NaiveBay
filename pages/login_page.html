<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Login Page</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Sergio Jimenez Romero">
        <link rel="stylesheet" href="../css/login_components.css"> 
        <link rel="stylesheet" href="../css/components.css"> 
        <link rel="stylesheet" href="../css/normalize.css"> 
    </head>
    <body>
        <main class="login-page-container">
            <video class="login-video" autoplay muted loop playsinline>
                <source src="../assets/videos/beach_login.mp4">
            </video>
            <div class="login-container">
                <header class="login-header">
                    <img class="login-logo" src="../assets/images/logo_transparente.png">
                    <!-- TODO: see if we add a text for naive bay -->
                    <h4 class="text">Sign in to your account</h4>
                </header>
                <section class="login-info-container">
                    <form class="login-form">
                        <input class="text-input" type="text" id="Username" name="Username", placeholder="Username">
                        <input class="text-input" type="text" id="Password" name="Password", placeholder="Password">
                        <input class="button login-button button__blue" type="submit" value="Login">
                    </form>
                    <a href="../index.html" class="nav-button-container button-text">
                        <button class="button login-button ">Back</button>
                    </a>
                    <nav class="login-links-container">
                        <a class="login-link text" href="#">Register</a>
                        <a class="login-link text" href="#">Forgot your password?</a>
                    </nav>
                </section>
                <footer>
                    <p class="text">NaiveBay 2025</p>
                </footer>
            </div>
        </main>
    </body>
</html>
