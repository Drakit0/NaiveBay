<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Login Page</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Sergio Jimenez Romero">
        <link rel="stylesheet" href="login_style.css"> 
    </head>
    <body>
        <main class="container">
            <video class="login_video" autoplay muted loop playsinline>
                <source src="data/beach_login.mp4">
            </video>
            <div class="login-container">
                <header>
                    <img src="data/logo_transparente.png">
                    <!-- TODO: see if we add a text for naive bay -->
                    <h4>Sign in to your account</h4>
                </header>
                <section>
                    <form class="form-container">
                        <input type="text" id="Username" name="Username", placeholder="Username">
                        <input type="text" id="Password" name="Password", placeholder="Password">
                        <button type="submit">Login</button>
                    </form>
                    <nav class="links-container">
                        <a href="#">Register</a>
                        <a href="#">Forgot your password?</a>
                    </nav>
                </section>
                <footer>
                    <p>NaiveBay 2025</p>
                </footer>
            </div>
        </main>
    </body>
</html>
