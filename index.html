<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>NaiveBay</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Sergio Jimenez Romero">
        <link rel="icon" href="assets/favicon/favicon.ico"/>
        <link rel="stylesheet" href="css/components.css"/> 
        <link rel="stylesheet" href="css/normalize.css"/> 
        <link rel="stylesheet" href="css/main_page_components.css"/>
        <script src="js/sidebar_activation.js"></script>

    </head>
    <body>
        <main class="main-page-container">
            <header class="main-page-header">
                <img src="assets/icons/menu_bar.png" class="main-page-icon big-on-hover" onclick="sidebarToggle()">
                <a href="index.html">
                    <img class="main-page-logo" src="./assets/images/logo_transparente.png">
                </a>
                <div class="search-bar-container">
                    <div class="search-bar">
                        <input type="text" class="search-input" placeholder="Search"/>
                        <button type="submit" class="button__blue search-button ">
                            <img src="assets/icons/search_icon.png" class="search-icon big-on-hover">
                        </button>
                    </div>
                </div>
                <div class="main-page-login-container">
                    <a href="./pages/login_page.html" class="button-text">
                        <button class="button login-button " >Login</button>
                    </a>
                </div>
                
                
            </header>
            <div class="main-page__overlay" id="main-page__overlay" onclick="sidebarToggle()"></div>
            <aside class="main-page__sidebar text text__white" id="main-page__sidebar">
                <img src="assets/icons/delete-sign.png" class="main-page-icon big-on-hover" onclick="sidebarToggle()">
                <h3>Categories</h3>
                <ul class="sidebar-list">
                    <li>Category 1</li>
                    <li>Category 2</li>
                    <li>Category 3</li>
                    <li>Category 4</li>
                    <li>Category 5</li>
                </ul>
            </aside>
            
            <section class="main-page-content">
                <img src="assets/images/main_page_background.jpg" >
            </section>
            <footer class="main-page-footer">
                <div class="main-page-footer-container">
                    <div class="footer-section text text__white">
                        <h4 class="text text__white">Buy</h4>
                        <ul class="footer-list text__white">
                            <li>Trending</li>
                            <li>Category 1</li>
                            <li>Category 2</li>
                            <li>Category 3</li>
                        </ul>
                    </div>
                    <div class="footer-section text text__white">
                        <h4 class="text text__white">Sell</h4>
                        <ul class="footer-list text__white">
                            <li>Create listing</li>
                        </ul>
                    </div>
                    <div class="footer-section text text__white">
                        <h4>About Us</h4>
                        <ul class="footer-list ">
                            <li>Facebook</li>
                            <li>Twitter</li>
                        </ul>    
                    </div>
                </div>
                <p class="text text__white">NaiveBay 2025</p>
            </footer>
        </main>
        
    </body>
</html>
