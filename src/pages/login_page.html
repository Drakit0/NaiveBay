<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Login Page</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <meta name="author" content="Sergio Jimenez Romero"/>
        <link rel="stylesheet" href="../css/login_components.css"/> 
        <link rel="stylesheet" href="../css/components.css"/> 
        <link rel="stylesheet" href="../css/normalize.css"/> 
        <script src="../js/password_validation.js"></script>
    </head>
    <body>
        <main class="login-page__container">
            <video class="login__video" autoplay muted loop playsinline>
                <source src="../assets/videos/beach_login.mp4">
            </video>
            <div class="login__container">
                <header class="login__header">
                    <img class="login__logo" src="../assets/images/logo_transparente.png">
                    <h4 class="text">Sign in to your account</h4>
                </header>
                <section class="login__info-container">
                    <p class="text text__red" id="password-message"></p>
                    <form class="login__form" id="login__form">
                        <input class="text-input" type="text" id="Username" name="Username" placeholder="Username">
                        <input class="text-input" type="password" id="Password" name="Password" placeholder="Password">
                        <input class="button login__button button__blue" type="submit" value="Login">
                    </form>
                    <a href="../index.html" class="nav-button-container button-text">
                        <button class="button login__button ">Back</button>
                    </a>
                    <nav class="login__links-container">
                        <a class="login__link text" href="register_page.html">Register</a>
                        <a class="login__link text" href="#">Forgot your password?</a>
                    </nav>
                </section>
                <footer class="login__footer">
                    <p class="text">NaiveBay 2025</p>
                </footer>
            </div>
        </main>
    </body>
</html>
