<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>NaiveBay</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Sergio Jimenez Romero">
        <link rel="icon" href="assets/favicon/favicon.ico"/>
        <link rel="stylesheet" href="css/components.css"/> 
        <link rel="stylesheet" href="css/normalize.css"/> 
        <link rel="stylesheet" href="css/main_page_components.css"/>
        <script src="js/sidebar_activation.js"></script>
        <script src="js/login_button_state.js"></script>
        <script defer src="js/search_functionality.js"></script>

    </head>
    <body>
        <main class="main-page__container">
            <header class="main-page__header">
                <img src="assets/icons/menu_bar.png" class="main-page__icon big-on-hover" onclick="sidebarToggle()"/>
                <a href="index.html">
                    <img class="main-page__logo" src="./assets/images/logo_transparente.png">
                </a>
                <div class="search-bar-container">
                    <form class="search-bar" id="search-bar">
                        <input type="text" class="search-input" id="search-input" placeholder="Search" required/>
                        <button type="submit" class="button__blue search-button ">
                            <img src="assets/icons/search_icon.png" class="search-icon big-on-hover">
                        </button>
                    </form>
                </div>
                <div class="main-page__login-container" id="main-page__login-container">
                    
                </div>    
                
            </header>
            <div class="main-page__overlay" id="main-page__overlay" onclick="sidebarToggle()"></div>
            <aside class="main-page__sidebar text text__white" id="main-page__sidebar">
                <img src="assets/icons/delete-sign.png" class="main-page__icon big-on-hover" onclick="sidebarToggle()">
                <h3>Categories</h3>
                <ul class="sidebar-list">
                    <li>Category 1</li>
                    <li>Category 2</li>
                    <li>Category 3</li>
                    <li>Category 4</li>
                    <li>Category 5</li>
                </ul>
            </aside>
            
            <section class="main-page__content">
                 <div class="main-page__auction-list">
                    <h2 class="text">Trending</h2>
                    <!-- TODO: see if we include the items with JS -->
                 </div>
                 <div class="main-page__auction-list">
                    <h2 class="text">Ending soon!</h2>
                    <!-- TODO: see if we include the items with JS -->
                 </div>
            </section>
            <footer class="main-page__footer">
                <div class="main-page__footer-container">
                    <div class="footer-section text text__white">
                        <h4 class="text text__white">Buy</h4>
                        <ul class="footer-list text__white">
                            <li>Trending</li>
                            <li>Category 1</li>
                            <li>Category 2</li>
                            <li>Category 3</li>
                        </ul>
                    </div>
                    <div class="footer-section text text__white">
                        <h4 class="text text__white">Sell</h4>
                        <ul class="footer-list text__white">
                            <li>Create listing</li>
                        </ul>
                    </div>
                    <div class="footer-section text text__white">
                        <h4>About Us</h4>
                        <ul class="footer-list ">
                            <li>Facebook</li>
                            <li>Twitter</li>
                        </ul>    
                    </div>
                </div>
                <p class="text text__white">NaiveBay 2025</p>
            </footer>
        </main>
        
    </body>
</html>
